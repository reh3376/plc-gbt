[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-enhancement-framework"
version = "1.0.0"
description = "Comprehensive framework for AI-assisted development with task orchestration, memory management, and code analysis"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "AI Enhancement Framework Team", email = "support@ai-enhancement-framework.dev"}
]
maintainers = [
    {name = "AI Enhancement Framework Team", email = "support@ai-enhancement-framework.dev"}
]
keywords = [
    "ai", "development", "framework", "code-analysis", "task-orchestration", 
    "memory-management", "cursor", "ide", "assistant", "automation"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
    "dataclasses; python_version<'3.7'",
]

[project.optional-dependencies]
full = [
    "redis>=4.0.0",
    "neo4j>=5.0.0",
    "psycopg2-binary>=2.9.0",
    "qdrant-client>=1.0.0",
    "aiohttp>=3.8.0",
    "asyncpg>=0.28.0",
    "structlog>=22.0.0",
    "click>=8.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
monitoring = [
    "aiohttp>=3.8.0",
    "redis>=4.0.0",
    "neo4j>=5.0.0",
    "asyncpg>=0.28.0",
    "qdrant-client>=1.0.0",
]
docker = [
    "docker>=6.0.0",
    "docker-compose>=1.29.0",
]

[project.urls]
Homepage = "https://github.com/ai-enhancement-framework/ai-enhancement-framework"
Documentation = "https://ai-enhancement-framework.readthedocs.io"
Repository = "https://github.com/ai-enhancement-framework/ai-enhancement-framework"
"Bug Tracker" = "https://github.com/ai-enhancement-framework/ai-enhancement-framework/issues"

[project.scripts]
ai-framework = "ai_enhancement_framework.cli:main"

[tool.setuptools]
packages = ["ai_enhancement_framework", "ai_enhancement_framework.core"]

[tool.setuptools.package-dir]
"ai_enhancement_framework" = "."

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
] 