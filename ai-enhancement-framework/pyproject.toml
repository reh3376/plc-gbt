[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-enhancement-framework"
version = "2.1.0"
description = "Modular AI Enhancement Framework with selective component loading for Python development projects"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "AI Enhancement Framework Team", email = "support@ai-enhancement-framework.dev"}
]
maintainers = [
    {name = "AI Enhancement Framework Team", email = "support@ai-enhancement-framework.dev"}
]
keywords = [
    "ai", "development", "framework", "modular", "code-analysis", "task-orchestration", 
    "memory-management", "cursor", "ide", "assistant", "automation", "wolfram-alpha",
    "llm-integration", "provider-abstraction", "selective-loading"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
    "dataclasses; python_version<'3.7'",
]

[project.optional-dependencies]
# Modular Dependencies - Install only what you need
code-analysis = [
    "libcst>=1.0.0",
    "astroid>=3.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]
database-providers = [
    "redis>=4.5.0",
    "neo4j>=5.8.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.28.0",
    "qdrant-client>=1.6.0",
]
llm-integration = [
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "tiktoken>=0.5.0",
    "transformers>=4.30.0",
]
wolfram-alpha = [
    "requests>=2.31.0",
    "sympy>=1.12.0",
    "numpy>=1.24.0",
]
optimization = [
    "libcst>=1.0.0",
    "astroid>=3.0.0",
    "click>=8.1.0",
]
monitoring = [
    "aiohttp>=3.8.0",
    "psutil>=5.9.0",
    "structlog>=23.1.0",
]
docker = [
    "docker>=6.0.0",
    "docker-compose>=1.29.0",
]
# Install everything for full functionality
full = [
    "ai-enhancement-framework[code-analysis,database-providers,llm-integration,wolfram-alpha,optimization,monitoring,docker]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/ai-enhancement-framework/ai-enhancement-framework"
Documentation = "https://ai-enhancement-framework.readthedocs.io"
Repository = "https://github.com/ai-enhancement-framework/ai-enhancement-framework"
"Bug Tracker" = "https://github.com/ai-enhancement-framework/ai-enhancement-framework/issues"

[project.scripts]
ai-framework = "ai_enhancement_framework.cli:main"
ai-modules = "ai_enhancement_framework.cli_modules:main"

[tool.setuptools]
packages = [
    "ai_enhancement_framework",
    "ai_enhancement_framework.core", 
    "ai_enhancement_framework.config",
    "ai_enhancement_framework.providers",
    "ai_enhancement_framework.optimization",
    "ai_enhancement_framework.monitoring",
    "ai_enhancement_framework.install",
    "ai_enhancement_framework.docker",
    "ai_enhancement_framework.templates"
]

[tool.setuptools.package-dir]
"ai_enhancement_framework" = "."

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  # markdown files
  | .*\.md$
  | .*\.mdx$
)/
'''

[tool.ruff]
target-version = "py38"
line-length = 88
exclude = [
    "*.md",
    "*.mdx",
    "**/*.md",
    "**/*.mdx",
]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
]

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
] 