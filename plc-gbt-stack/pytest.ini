[tool:pytest]
# Phase 16 Comprehensive Testing Configuration
# Coverage threshold: 95%
# Test discovery patterns
testpaths = tests
python_files = test_*.py *_test.py phase16_*.py
python_classes = Test* *Test
python_functions = test_*

# Coverage configuration
addopts = 
    -v
    --strict-markers
    --strict-config
    --cov=.
    --cov-report=html:htmlcov
    --cov-report=json:coverage.json
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=95
    --cov-config=.coveragerc

# Test markers
markers =
    unit: Unit tests
    integration: Integration tests
    security: Security tests
    performance: Performance tests
    e2e: End-to-end tests
    production: Production readiness tests
    slow: Slow running tests
    requires_docker: Tests requiring Docker
    requires_neo4j: Tests requiring Neo4j
    requires_qdrant: Tests requiring Qdrant
    requires_openai: Tests requiring OpenAI API

# Minimum Python version
minversion = 3.9

# Test timeout (30 seconds)
timeout = 30

# Parallel execution
# addopts = -n auto  # Uncomment for parallel execution

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning
    error::UserWarning 