services:
  # HashiCorp Vault for Secrets Management (Phase 15.1)
  vault:
    image: vault:1.15
    container_name: plc-vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_ROOT_TOKEN:-vault-root-token}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://127.0.0.1:8200
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
      - ./security/vault/config:/vault/config
      - ./security/vault/policies:/vault/policies
    cap_add:
      - IPC_LOCK
    networks:
      - plc-security-network
      - plc-internal-network
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: ["vault", "server", "-config=/vault/config"]

  # mTLS Reverse Proxy for Database Security (Phase 15.1)
  mtls-proxy:
    build:
      context: ./security/mtls
      dockerfile: Dockerfile
    container_name: plc-mtls-proxy
    ports:
      - "8443:8443"  # HTTPS with mTLS
    environment:
      - PROXY_TARGET_NEO4J=neo4j:7687
      - PROXY_TARGET_POSTGRES=postgres:5432
      - PROXY_TARGET_REDIS=redis:6379
      - PROXY_TARGET_QDRANT=qdrant:6333
      - CERT_DIR=/certs
      - CA_CERT_PATH=/certs/ca.crt
      - SERVER_CERT_PATH=/certs/server.crt
      - SERVER_KEY_PATH=/certs/server.key
    volumes:
      - ./security/certs:/certs:ro
      - ./security/mtls/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - plc-security-network
      - plc-database-network
    healthcheck:
      test: ["CMD", "curl", "-k", "https://localhost:8443/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Neo4j Knowledge Graph Database
  neo4j:
    image: neo4j:5-enterprise
    container_name: plc-neo4j
    ports:
      - "127.0.0.1:7474:7474"  # HTTP - localhost only
      - "127.0.0.1:7687:7687"  # Bolt - localhost only
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_server_memory_heap_initial__size=2G
      - NEO4J_server_memory_heap_max__size=4G
      - NEO4J_server_memory_pagecache_size=2G
      - NEO4J_server_bolt_listen__address=0.0.0.0:7687
      - NEO4J_server_http_listen__address=0.0.0.0:7474
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
      - ./seed:/seed:ro
    networks:
      - plc-database-network
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: plc-qdrant
    ports:
      - "127.0.0.1:6333:6333"  # HTTP - localhost only
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - plc-database-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # PostgreSQL for metadata
  postgres:
    image: postgres:15-alpine
    container_name: plc-postgres
    ports:
      - "127.0.0.1:5432:5432"  # Expose PostgreSQL port for live connections - localhost only
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - plc-database-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: plc-redis
    ports:
      - "127.0.0.1:6379:6379"  # localhost only
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - plc-database-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Safety Interlocks Service (Phase 15.2)
  safety-interlocks:
    build:
      context: ./security/safety
      dockerfile: Dockerfile
    container_name: plc-safety-interlocks
    ports:
      - "127.0.0.1:8300:8300"  # localhost only
    environment:
      - SAFETY_LOG_LEVEL=${SAFETY_LOG_LEVEL:-INFO}
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    volumes:
      - safety_logs:/app/logs
      - ./security/safety/policies:/app/policies:ro
    depends_on:
      vault:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - plc-security-network
      - plc-database-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8300/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # N8N Workflow Automation Platform (Phase 26.2) - Optimized for >99% Test Success
  n8n:
    image: n8nio/n8n:latest
    container_name: plc-n8n
    ports:
      - "127.0.0.1:5678:5678"  # N8N Web UI - localhost only
    environment:
      # Core N8N Configuration
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      
      # Database Configuration - SQLite (for N8N internal use)
      # Note: Environment isolation maintained through external DB settings below
      
      # Queue Configuration - Redis (Environment Isolation - Database 2)
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_DB=2
      - EXECUTIONS_MODE=queue
      
      # Security and File Permissions
      - N8N_ENCRYPTION_KEY=plc-gbt-n8n-encryption-key-2025
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      
      # Logging
      - N8N_LOG_LEVEL=info
      
      # PLC Integration Environment Variables (Phase 26.4 Support)
      - PLC_POSTGRES_HOST=postgres
      - PLC_POSTGRES_USER=plc_user
      - PLC_POSTGRES_PASSWORD=postgres_password
      - PLC_NEO4J_URI=bolt://neo4j:7687
      - PLC_NEO4J_USER=neo4j
      - PLC_NEO4J_PASSWORD=password
      - PLC_NEO4J_DATABASE=n8n
      - PLC_REDIS_HOST=redis
      - PLC_REDIS_PORT=6379
      - PLC_QDRANT_URL=http://qdrant:6333
      
      # Environment Isolation Settings for Testing
      - DB_POSTGRESDB_SCHEMA=n8n
      
    volumes:
      # Essential N8N Data Persistence Only
      - n8n_data:/home/node/.n8n
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - plc-internal-network
      - plc-database-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # N8N-MCP AI Enhancement Integration (Phase 26.7)
  n8n-mcp:
    image: ghcr.io/czlonkowski/n8n-mcp:latest
    container_name: plc-n8n-mcp
    ports:
      - "127.0.0.1:3000:3000"  # HTTP mode for remote access - localhost only
    environment:
      # MCP Server Configuration
      - MCP_MODE=http
      - USE_FIXED_HTTP=true
      - AUTH_TOKEN=${N8N_MCP_AUTH_TOKEN:-n8n-mcp-auth-token-2025}
      - PORT=3000
      - NODE_ENV=production
      - LOG_LEVEL=info
      - DISABLE_CONSOLE_OUTPUT=false
      
      # N8N API Integration - Connect to existing plc-n8n container
      - N8N_API_URL=http://plc-n8n:5678
      - N8N_API_KEY=${N8N_API_KEY:-}
      - N8N_API_TIMEOUT=30000
      - N8N_API_MAX_RETRIES=3
      
      # Database Configuration (Custom path for namespace isolation)
      - NODE_DB_PATH=/app/data/plc-n8n-mcp/nodes.db
      - REBUILD_ON_START=false
      
      # Performance Optimization
      - NODE_OPTIONS=--max-old-space-size=512
      
    volumes:
      # Persistent storage for n8n-mcp database and cache
      - n8n_mcp_data:/app/data
      
    depends_on:
      n8n:
        condition: service_healthy
    networks:
      - plc-internal-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ETL Worker
  etl-worker:
    build:
      context: ./workers
      dockerfile: etl_worker.Dockerfile
    container_name: plc-etl-worker
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEO4J_BOLT_URL=${NEO4J_BOLT_URL}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - QDRANT_HOST=${QDRANT_HOST}
      - QDRANT_PORT=${QDRANT_PORT}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - ETL_BATCH_SIZE=${ETL_BATCH_SIZE}
      - ETL_WORKER_THREADS=${ETL_WORKER_THREADS}
      - LOG_LEVEL=${ETL_LOG_LEVEL}
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
    volumes:
      - ./incoming:/app/incoming
      - ./processed:/app/processed
    networks:
      - plc-internal-network
      - plc-database-network

  # Gateway API
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: plc-gateway
    ports:
      - "127.0.0.1:8000:8000"  # localhost only
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
      safety-interlocks:
        condition: service_healthy
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEO4J_BOLT_URL=${NEO4J_BOLT_URL}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - QDRANT_HOST=${QDRANT_HOST}
      - QDRANT_PORT=${QDRANT_PORT}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - GATEWAY_HOST=127.0.0.1  # localhost only
      - GATEWAY_PORT=${GATEWAY_PORT}
      - GATEWAY_BEARER_TOKEN=${GATEWAY_BEARER_TOKEN}
      - GATEWAY_CORS_ORIGINS=${GATEWAY_CORS_ORIGINS},http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:8081,http://localhost:8081
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW}
      - LOG_LEVEL=${LOG_LEVEL}
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN}
      - SAFETY_SERVICE_URL=http://safety-interlocks:8300
    networks:
      - plc-internal-network
      - plc-database-network
      - plc-security-network

  # PLC Memory CLI Service - Containerized for Docker Desktop Port Forwarding Issues
  plc-memory:
    build:
      context: ./scripts/ai
      dockerfile: Dockerfile.plc-memory
    container_name: plc-memory-cli
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - NEO4J_HOST=neo4j
      - QDRANT_HOST=qdrant
      - POSTGRES_DB=plc_gbt
      - POSTGRES_USER=plc_user
      - POSTGRES_PASSWORD=postgres_password
      - NEO4J_PASSWORD=password
    networks:
      - plc-database-network
    volumes:
      - ./scripts/ai:/data  # Mount for input/output files
    command: ["--help"]  # Default to help command
    profiles:
      - tools  # Optional service, start with --profile tools

# Phase 15 Enhanced Network Security
networks:
  # Internal application network - isolated from external access
  plc-internal-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    internal: false  # Allows internet access for services

  # Database network - isolated internal network
  plc-database-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1
    internal: true  # No internet access - database isolation

  # Security services network - for Vault and safety systems
  plc-security-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.22.0.0/16
          gateway: 172.22.0.1
    internal: false  # Vault needs external access for authentication

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  qdrant_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  vault_data:
    driver: local
  vault_logs:
    driver: local
  safety_logs:
    driver: local
  n8n_data:
    driver: local
  n8n_logs:
    driver: local
  n8n_mcp_data:
    driver: local
