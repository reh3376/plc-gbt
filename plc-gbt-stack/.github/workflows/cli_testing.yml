name: PLC-GBT CLI Testing

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'cli/**'
      - 'tests/**'
      - '.github/workflows/cli_testing.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'cli/**'
      - 'tests/**'
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: true
        default: 'all'
        type: choice
        options:
          - 'integration'
          - 'performance'
          - 'all'
      quick_mode:
        description: 'Run in quick mode (fewer iterations)'
        required: false
        default: false
        type: boolean

env:
  PYTHONPATH: ${{ github.workspace }}
  PLC_MEMORY_TEST_ENV: "ci"
  PLC_MEMORY_LOG_LEVEL: "INFO"

jobs:
  # Environment validation job
  validate:
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.matrix.outputs.python-versions }}
      os-matrix: ${{ steps.matrix.outputs.os-matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set test matrix
        id: matrix
        run: |
          echo "python-versions=[\"3.8\", \"3.9\", \"3.10\", \"3.11\"]" >> $GITHUB_OUTPUT
          echo "os-matrix=[\"ubuntu-latest\", \"windows-latest\", \"macos-latest\"]" >> $GITHUB_OUTPUT

  # Integration tests
  integration-tests:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.validate.outputs.os-matrix) }}
        python-version: ${{ fromJson(needs.validate.outputs.python-versions) }}
        exclude:
          # Exclude specific combinations to reduce CI load
          - os: windows-latest
            python-version: "3.8"
          - os: macos-latest
            python-version: "3.8"
    
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better context
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo systemctl start redis
      
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install redis
          brew services start redis
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest psutil pyyaml pytest-asyncio pytest-cov
      
      - name: Validate CLI installation
        run: |
          python -c "import sys; print(f'Python {sys.version}')"
          # Add CLI validation here when CLI is available
      
      - name: Create test configuration
        run: |
          mkdir -p test_results
          cat > cli_test_config.yaml << EOF
          cli_command: "python -m plc_gbt_stack.cli.plc_control_loop_cli"
          timeout: 30
          benchmark_iterations: 2
          integration_tests:
            enable_plc_tests: false
            test_instances: 1
          performance_tests:
            enable_benchmarks: false
          EOF
      
      - name: Run integration tests
        run: |
          cd plc-gbt-stack
          python cli/testing/run_tests.py \
            --integration \
            --config ../cli_test_config.yaml \
            --verbose \
            ${{ github.event.inputs.quick_mode == 'true' && '--quick' || '' }}
        continue-on-error: true
        id: integration_tests
      
      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: integration-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            plc-gbt-stack/test_results/
            cli_test_config.yaml
          retention-days: 30
      
      - name: Parse test results
        if: always()
        run: |
          if [ -f "plc-gbt-stack/test_results/test_summary_*.txt" ]; then
            echo "## Integration Test Summary" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat plc-gbt-stack/test_results/test_summary_*.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

  # Performance tests (run only on Ubuntu with Python 3.10)
  performance-tests:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'performance' || github.event.inputs.test_type == 'all' || github.event_name != 'workflow_dispatch'
    
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo systemctl start redis
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest psutil pyyaml pytest-asyncio pytest-benchmark
      
      - name: Run performance tests
        run: |
          cd plc-gbt-stack
          python cli/testing/run_tests.py \
            --performance \
            --verbose
        continue-on-error: true
      
      - name: Upload performance results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: performance-results
          path: plc-gbt-stack/test_results/
          retention-days: 30

  # Complete test suite (only on schedule or manual trigger)
  complete-tests:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.test_type == 'all')
    
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo systemctl start redis
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest psutil pyyaml pytest-asyncio pytest-cov pytest-benchmark
      
      - name: Run complete test suite
        run: |
          cd plc-gbt-stack
          python cli/testing/run_tests.py \
            --all \
            --verbose \
            ${{ github.event.inputs.quick_mode == 'true' && '--quick' || '' }}
        continue-on-error: true
      
      - name: Generate coverage report
        run: |
          cd plc-gbt-stack
          pytest --cov=cli --cov-report=xml --cov-report=html cli/
        continue-on-error: true
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: plc-gbt-stack/coverage.xml
          flags: cli-tests
          name: cli-coverage
      
      - name: Upload complete test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: complete-test-results
          path: |
            plc-gbt-stack/test_results/
            plc-gbt-stack/htmlcov/
          retention-days: 30

  # Test result aggregation and reporting
  report:
    needs: [integration-tests, performance-tests]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/
      
      - name: Aggregate test results
        run: |
          echo "# PLC-GBT CLI Test Results" > test_summary.md
          echo "" >> test_summary.md
          echo "## Test Execution Summary" >> test_summary.md
          echo "" >> test_summary.md
          
          # Count total artifacts
          total_artifacts=$(find artifacts/ -name "integration-results-*" | wc -l)
          echo "- Total test environments: $total_artifacts" >> test_summary.md
          
          # Check for any test failures
          if find artifacts/ -name "*.txt" -exec grep -l "Failed:" {} \; | head -1 > /dev/null; then
            echo "- ❌ Some tests failed" >> test_summary.md
            echo "" >> test_summary.md
            echo "## Failed Tests" >> test_summary.md
            find artifacts/ -name "*.txt" -exec grep -l "Failed:" {} \; | while read file; do
              env_name=$(echo "$file" | sed 's/.*integration-results-\([^/]*\).*/\1/')
              echo "### $env_name" >> test_summary.md
              echo "\`\`\`" >> test_summary.md
              grep -A 10 "Failed:" "$file" >> test_summary.md
              echo "\`\`\`" >> test_summary.md
              echo "" >> test_summary.md
            done
          else
            echo "- ✅ All tests passed" >> test_summary.md
          fi
          
          echo "" >> test_summary.md
          echo "## Artifacts" >> test_summary.md
          echo "Test results are available in the workflow artifacts." >> test_summary.md
      
      - name: Comment PR (if PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('test_summary.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
      
      - name: Upload aggregated summary
        uses: actions/upload-artifact@v3
        with:
          name: test-summary
          path: test_summary.md

  # Notification job (only on failure)
  notify:
    needs: [integration-tests, performance-tests, complete-tests]
    runs-on: ubuntu-latest
    if: failure() && (github.event_name == 'schedule' || github.ref == 'refs/heads/main')
    
    steps:
      - name: Send notification
        run: |
          echo "Tests failed on main branch or scheduled run"
          # Add Slack/email notification here if needed 