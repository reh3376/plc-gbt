# Phase 17.2: Policy Engine & Automated Governance Configuration
# PLC-GPT Industrial Control Policy Management

# OPA Rego Engine Configuration
opa_engine:
  server_url: "http://localhost:8181"
  timeout_seconds: 5
  fallback_to_local: true
  cache_ttl_seconds: 300
  max_cache_entries: 1000

# Safety Gate Policies Configuration
safety_gates:
  plc_download:
    enabled: true
    min_safety_score: 90
    required_approvals: 1
    emergency_stop_required: true
    fail_safe_required: true
    violation_action: "block"
    
  critical_operations:
    enabled: true
    min_safety_score: 95
    required_approvals: 2
    emergency_stop_required: true
    fail_safe_required: true
    guardlogix_signature_required: true
    violation_action: "block"
    
  safety_configuration:
    enabled: true
    min_safety_score: 98
    required_approvals: 3
    emergency_stop_required: true
    fail_safe_required: true
    guardlogix_signature_required: true
    sil_verification_required: true
    violation_action: "block"
    
  routine_operations:
    enabled: true
    min_safety_score: 70
    required_approvals: 1
    emergency_stop_required: false
    fail_safe_required: false
    violation_action: "warn"

# Compliance Requirements
compliance:
  iec62443:
    enabled: true
    target_security_level: 3
    min_compliance_score: 85
    assessment_frequency: "quarterly"
    
  iec61508:
    enabled: true
    target_sil_level: 2
    min_safety_score: 90
    verification_required: true
    
  isa95:
    enabled: true
    zone_segmentation_required: true
    access_control_required: true
    
  audit_requirements:
    enabled: true
    retention_days: 365
    real_time_logging: true
    compliance_reporting: true

# Real-time Monitoring Configuration
real_time_monitoring:
  enabled: true
  event_queue_size: 1000
  processing_threads: 4
  violation_response_timeout: 30
  
  # Monitoring thresholds
  thresholds:
    critical_violations_per_hour: 5
    high_violations_per_hour: 10
    medium_violations_per_hour: 20
    
  # Response escalation
  escalation:
    critical_immediate: true
    high_within_minutes: 15
    medium_within_hours: 2
    
  # Notification settings
  notifications:
    email:
      enabled: false
      smtp_server: "smtp.company.com"
      smtp_port: 587
      recipients:
        - "safety-team@company.com"
        - "compliance@company.com"
    
    slack:
      enabled: false
      webhook_url: ""
      channel: "#plc-safety-alerts"
      
    sms:
      enabled: false
      service_provider: "twilio"
      emergency_contacts:
        - "+1234567890"

# Policy Violation Actions
violation_actions:
  block:
    description: "Block operation immediately"
    log_level: "critical"
    notify_immediately: true
    require_override: true
    
  warn:
    description: "Issue warning but allow operation"
    log_level: "warning"
    notify_immediately: false
    require_acknowledgment: true
    
  log:
    description: "Log violation for audit purposes"
    log_level: "info"
    notify_immediately: false
    require_acknowledgment: false
    
  escalate:
    description: "Escalate to management"
    log_level: "error"
    notify_immediately: true
    escalation_timeout: 3600
    
  emergency_stop:
    description: "Trigger emergency shutdown"
    log_level: "critical"
    notify_immediately: true
    require_manual_reset: true

# Audit and Reporting Configuration
audit_reporting:
  enabled: true
  
  # Audit trail settings
  audit_trail:
    enabled: true
    log_file: "/app/logs/policy_audit.log"
    max_file_size: "100MB"
    backup_count: 10
    retention_days: 365
    
  # Compliance reporting
  compliance_reports:
    enabled: true
    output_directory: "/app/reports/compliance"
    formats: ["json", "yaml", "pdf"]
    schedule:
      daily: true
      weekly: true
      monthly: true
      quarterly: true
    
  # Report distribution
  report_distribution:
    email:
      enabled: false
      recipients:
        - "compliance@company.com"
        - "management@company.com"
    
    file_share:
      enabled: false
      path: "/shared/compliance-reports"
      
    database:
      enabled: true
      connection_string: "postgresql://user:pass@localhost/compliance"

# Policy Rule Templates
policy_templates:
  safety_gate_template:
    type: "safety_gate"
    severity: "critical"
    status: "active"
    violation_action: "block"
    rego_template: |
      package plc_gbt.safety_gates
      
      default allow = false
      
      allow {
          input.safety_score >= {{min_safety_score}}
          count(input.approvals) >= {{required_approvals}}
          {{#if emergency_stop_required}}
          input.emergency_stop_validated == true
          {{/if}}
      }
      
      violations[msg] {
          input.safety_score < {{min_safety_score}}
          msg := sprintf("Safety score %v%% below {{min_safety_score}}%% threshold", [input.safety_score])
      }
      
  compliance_template:
    type: "compliance"
    severity: "medium"
    status: "active"
    violation_action: "warn"
    rego_template: |
      package plc_gbt.compliance
      
      default allow = false
      
      allow {
          input.compliance_score >= {{min_compliance_score}}
          input.audit_trail_complete == true
      }
      
      violations[msg] {
          input.compliance_score < {{min_compliance_score}}
          msg := sprintf("Compliance score %v%% below {{min_compliance_score}}%% threshold", [input.compliance_score])
      }

# Integration with Phase 15 Security Components
phase15_integration:
  vault_secrets_manager:
    enabled: true
    policy_secrets_path: "plc-gbt/policies"
    
  mtls_reverse_proxy:
    enabled: true
    policy_endpoint_protection: true
    
  industrial_safety_interlocks:
    enabled: true
    policy_approval_integration: true
    
  secure_config_manager:
    enabled: true
    policy_config_encryption: true
    
  orchestrator_reliability:
    enabled: true
    policy_task_validation: true

# Development and Testing
development:
  debug_mode: false
  test_policies_enabled: false
  mock_opa_server: false
  policy_simulation_mode: false
  
  # Test data
  test_scenarios:
    - name: "high_safety_score"
      data:
        safety_score: 95
        approvals: ["engineer1", "manager1"]
        emergency_stop_validated: true
        
    - name: "low_safety_score"
      data:
        safety_score: 60
        approvals: ["engineer1"]
        emergency_stop_validated: false
        
    - name: "critical_operation"
      data:
        operation_type: "critical"
        safety_score: 98
        approvals: ["engineer1", "manager1", "safety_officer1"]
        emergency_stop_validated: true
        guardlogix_signature: "valid"

# Performance and Scalability
performance:
  max_concurrent_evaluations: 100
  evaluation_timeout_seconds: 10
  cache_optimization: true
  async_processing: true
  
  # Resource limits
  resource_limits:
    max_memory_mb: 512
    max_cpu_percent: 80
    max_disk_io_mb: 100
    
  # Monitoring
  performance_monitoring:
    enabled: true
    metrics_collection: true
    slow_query_threshold_ms: 1000
    
# Backup and Recovery
backup:
  enabled: true
  backup_interval_hours: 24
  backup_retention_days: 30
  backup_location: "/app/backups/policies"
  
  # What to backup
  backup_components:
    - policy_rules
    - violation_history
    - compliance_reports
    - audit_trails
    - configuration
    
# Security Settings
security:
  encryption:
    enabled: true
    algorithm: "AES-256"
    key_rotation_days: 90
    
  access_control:
    enabled: true
    rbac_integration: true
    api_key_required: true
    
  audit_security:
    enabled: true
    log_all_access: true
    failed_access_monitoring: true
    
# Maintenance and Updates
maintenance:
  auto_updates: false
  update_check_interval_hours: 24
  maintenance_window: "02:00-04:00"
  
  # Health checks
  health_checks:
    enabled: true
    check_interval_seconds: 60
    failure_threshold: 3
    
  # Cleanup
  cleanup:
    enabled: true
    old_logs_retention_days: 90
    temp_files_cleanup: true
    cache_cleanup_interval_hours: 6 