events {
    worker_connections 1024;
}

http {
    upstream neo4j_backend {
        server neo4j:7687;
    }
    
    upstream postgres_backend {
        server postgres:5432;
    }
    
    upstream redis_backend {
        server redis:6379;
    }
    
    upstream qdrant_backend {
        server qdrant:6333;
    }

    # SSL configuration
    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_client_certificate /certs/ca.crt;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Health check endpoint
    server {
        listen 8443 ssl;
        server_name localhost;
        
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # Neo4j proxy
    server {
        listen 8443 ssl;
        server_name neo4j-proxy;
        
        location / {
            proxy_pass http://neo4j_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Client-Cert $ssl_client_cert;
        }
    }

    # PostgreSQL proxy
    server {
        listen 8443 ssl;
        server_name postgres-proxy;
        
        location / {
            proxy_pass http://postgres_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Client-Cert $ssl_client_cert;
        }
    }

    # Redis proxy
    server {
        listen 8443 ssl;
        server_name redis-proxy;
        
        location / {
            proxy_pass http://redis_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Client-Cert $ssl_client_cert;
        }
    }

    # Qdrant proxy
    server {
        listen 8443 ssl;
        server_name qdrant-proxy;
        
        location / {
            proxy_pass http://qdrant_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Client-Cert $ssl_client_cert;
        }
    }
} 