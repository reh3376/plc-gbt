# N8N Persistence Configuration for Phase 26
# AI Task Orchestrator Implementation  
# Generated on 2025-07-23

persistence:
  name: "n8n-persistence-layer"
  version: "1.0.0"
  description: "Data persistence configuration for N8N workflow automation"

  # Primary Data Storage
  primary_storage:
    type: "postgresql"
    connection:
      host: "postgres"
      port: 5432
      database: "plc_gbt"
      schema: "n8n"
      user: "plc_user"
      password: "postgres_password"
      ssl_mode: "disable"
      pool_size: 10
      connection_timeout: 30

  # Secondary Storage (Backup)
  backup_storage:
    enabled: true
    type: "file_system"
    path: "/home/node/.n8n/backups"
    retention_days: 30
    automated_backup: true
    backup_schedule: "0 2 * * *"  # Daily at 2 AM

  # Cache Layer
  cache:
    type: "redis"
    connection:
      host: "redis"
      port: 6379
      database: 3
      password: null
      ttl: 3600  # 1 hour default TTL

  # Workflow Storage
  workflows:
    storage_path: "/home/node/.n8n/workflows"
    versioning_enabled: true
    max_versions: 10
    compression_enabled: true
    backup_enabled: true

  # Execution History
  executions:
    retention_policy:
      success_days: 7
      error_days: 30
      max_executions: 10000
    storage_mode: "database"
    binary_data_path: "/home/node/.n8n/binary_data"

  # Credentials Storage
  credentials:
    storage_path: "/home/node/.n8n/credentials"
    encryption_enabled: true
    vault_integration:
      enabled: false
      vault_url: "http://vault:8200"
      mount_path: "n8n"

  # Session Management
  sessions:
    storage_type: "redis"
    session_timeout: 86400  # 24 hours
    max_sessions: 100

  # File System Configuration
  file_system:
    data_path: "/home/node/.n8n"
    temp_path: "/tmp/n8n"
    max_file_size: 100MB
    allowed_mime_types:
      - "application/json"
      - "text/plain"
      - "text/csv"
      - "application/pdf"

  # Database Migration
  migrations:
    auto_migrate: true
    backup_before_migration: true
    migration_path: "/home/node/.n8n/migrations"

  # Performance Optimization
  performance:
    connection_pooling:
      min_connections: 2
      max_connections: 10
      idle_timeout: 300
    query_optimization:
      use_prepared_statements: true
      enable_query_cache: true
      cache_size: 100MB

  # Monitoring and Logging
  monitoring:
    log_queries: false
    log_slow_queries: true
    slow_query_threshold: 1000  # milliseconds
    metrics_enabled: true

  # Data Integrity
  integrity:
    checksum_validation: true
    foreign_key_checks: true
    transaction_isolation: "READ_COMMITTED"

  # Security Configuration
  security:
    encrypted_at_rest: true
    access_logging: true
    audit_trail: true
    data_anonymization:
      enabled: false
      fields_to_anonymize: []

# Phase 26 Integration Settings
phase26_integration:
  plc_memory_integration: true
  multi_database_support: true
  namespace_isolation: true
  industrial_data_types: true 