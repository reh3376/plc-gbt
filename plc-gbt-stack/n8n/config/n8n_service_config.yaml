# N8N Service Configuration for Phase 26
# AI Task Orchestrator Implementation
# Generated on 2025-07-23

service:
  name: "n8n-workflow-automation"
  version: "1.102.4"
  description: "N8N Workflow Automation Platform integrated with PLC-GBT Stack"
  
  # Service Configuration
  host: "0.0.0.0"
  port: 5678
  protocol: "http"
  environment: "production"

  # Database Configuration
  database:
    type: "postgresdb"
    host: "postgres"
    port: 5432
    database: "plc_gbt"
    schema: "n8n"
    user: "plc_user"
    password: "postgres_password"

  # Security Configuration
  security:
    encryption_key: "plc-gbt-n8n-encryption-key-2025"
    jwt_secret: "plc-gbt-jwt-secret-2025"
    enforce_file_permissions: false

  # Logging Configuration
  logging:
    level: "info"
    output: ["console", "file"]
    file_location: "/home/node/.n8n/logs/"

  # Performance Configuration
  performance:
    payload_size_max: 16
    metrics_enabled: true
    disable_ui: false

  # Integration Configuration
  integrations:
    plc_memory:
      postgres:
        host: "postgres"
        user: "plc_user"
        password: "postgres_password"
      neo4j:
        uri: "bolt://neo4j:7687"
        user: "neo4j"
        password: "password"
        database: "n8n"
      redis:
        host: "redis"
        port: 6379
      qdrant:
        url: "http://qdrant:6333"

  # Queue Configuration
  queue:
    redis:
      host: "redis"
      port: 6379
      database: 2
    execution_mode: "queue"

  # Timezone Configuration
  timezone:
    generic: "America/Kentucky/Louisville"
    system: "America/Kentucky/Louisville"

# Health Check Configuration
health_check:
  endpoint: "/healthz"
  interval: 30
  timeout: 10
  retries: 5

# Restart Policy
restart_policy: "unless-stopped"

# Phase 26 Specific Configuration
phase26:
  custom_nodes_enabled: true
  workflow_templates_enabled: true
  natural_language_engine_enabled: true
  industrial_protocols_enabled: true
  llm_integration_enabled: true
  plc_memory_integration_enabled: true 