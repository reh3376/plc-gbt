[tool:pytest]
# N8N Framework Integration - Pytest Configuration
# Phase 1.5: Automated Testing Suite Implementation

testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Minimum test coverage requirement (>95%)
addopts = 
    --verbose
    --tb=short
    --cov=.
    --cov-report=html:tests/coverage_html
    --cov-report=term-missing
    --cov-report=xml:tests/coverage.xml
    --cov-fail-under=95
    --strict-markers
    --disable-warnings

# Test markers for industrial compliance
markers =
    unit: Unit tests for individual components
    integration: Integration tests for API endpoints  
    performance: Performance tests for industrial benchmarks
    database: Database schema and persistence tests
    playwright: Browser automation tests via MCP
    industrial: Industrial compliance and safety tests
    slow: Long-running tests (>1 second)
    
# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# Timeout settings for industrial requirements
timeout = 300
timeout_method = thread

# Parallel execution for performance
# Run with: pytest -n auto (requires pytest-xdist)
