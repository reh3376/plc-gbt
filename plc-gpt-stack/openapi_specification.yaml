openapi: 3.1.0
info:
  title: PLC-GPT Knowledge Gateway API
  description: |
    Gateway API for querying PLC knowledge graph and vector store.
    Provides access to industrial automation expertise through Neo4j knowledge graph,
    Qdrant vector database, and fine-tuned OpenAI models.
    
    **Key Features:**
    - Multi-strategy query processing (vector, graph, hybrid)
    - Real-time PLC component information
    - Industrial automation best practices
    - L5X/ACD file analysis and recommendations
    
    **Use Cases:**
    - "What AOIs are in Program MainProgram_v1.2?"
    - "How do I configure a PID loop for temperature control?"
    - "What are the best practices for motion control programming?"
    - "Analyze this L5X file for potential issues"
  version: "1.0.0"
  contact:
    name: PLC-GPT Support
    url: https://github.com/reh3376/plc-gbt
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000
    description: Development server
  - url: https://gateway.yourcorp.com
    description: Production server

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health Check
      description: Check the health status of all system components
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: System health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  timestamp:
                    type: string
                    format: date-time
                  services:
                    type: object
                    properties:
                      neo4j:
                        type: string
                        enum: [connected, disconnected, error]
                      qdrant:
                        type: string
                        enum: [connected, disconnected, error]
                      openai:
                        type: string
                        enum: [available, unavailable, error]

  /api/v1/query:
    post:
      summary: Query PLC Knowledge
      description: |
        Query the PLC knowledge graph and vector store for industrial automation information.
        
        **This is the primary endpoint for ChatGPT Actions.**
        
        **Example Queries:**
        - "What AOIs are available in the system?"
        - "How do I implement a PID control loop?"
        - "What are the safety considerations for motion control?"
        - "Explain the difference between PIDE and PID instructions"
        
        **Query Strategies:**
        - **Vector**: Semantic similarity search through documentation
        - **Graph**: Knowledge graph traversal for structured data
        - **Hybrid**: Combined approach for comprehensive results
      operationId: queryKnowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
            examples:
              aoi_query:
                summary: AOI Information Query
                value:
                  question: "What AOIs are in Program MainProgram_v1.2?"
                  max_results: 5
                  include_graph: true
                  include_vectors: true
              pid_configuration:
                summary: PID Configuration Help
                value:
                  question: "How do I configure a PID loop for temperature control?"
                  max_results: 10
                  include_graph: true
                  include_vectors: true
              best_practices:
                summary: Best Practices Query
                value:
                  question: "What are the best practices for motion control programming?"
                  max_results: 8
                  include_graph: false
                  include_vectors: true
      responses:
        '200':
          description: Query results with answer and supporting context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
              examples:
                aoi_response:
                  summary: AOI Query Response
                  value:
                    question: "What AOIs are in Program MainProgram_v1.2?"
                    answer: "The MainProgram_v1.2 contains 3 AOIs: TemperatureControl_v2.1 for process temperature management, MotionAxis_v1.0 for servo control, and SafetyMonitor_v3.0 for safety system integration."
                    graph_context:
                      nodes_found: 3
                      relationships: ["CONTAINS", "USES"]
                      components: ["AOI", "Program", "Routine"]
                    vector_context:
                      - source: "L5X_Analysis_Guide.pdf"
                        relevance: 0.89
                        snippet: "AOI (Add-On Instruction) components provide reusable logic blocks..."
                    citations:
                      - source: "MainProgram_v1.2.L5X"
                        relevance: 0.95
                        snippet: "TemperatureControl_v2.1 AOI configured for PID control"
                    processing_time_ms: 245.7
                    timestamp: "2025-01-07T12:00:00Z"
        '400':
          description: Bad request - invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid or missing bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/stats:
    get:
      summary: System Statistics
      description: Get current system statistics and metrics
      operationId: getSystemStats
      responses:
        '200':
          description: System statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStats'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token authentication. Use the GATEWAY_BEARER_TOKEN provided
        by your system administrator.
        
        Example: `Bearer your-secure-bearer-token-here`

  schemas:
    QueryRequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          description: |
            The question to ask about PLC systems, industrial automation,
            or specific components. Can be natural language.
          example: "What AOIs are in Program MainProgram_v1.2?"
          minLength: 3
          maxLength: 1000
        max_results:
          type: integer
          description: Maximum number of results to return
          default: 6
          minimum: 1
          maximum: 50
        include_graph:
          type: boolean
          description: Include knowledge graph context in response
          default: true
        include_vectors:
          type: boolean
          description: Include vector search context in response
          default: true

    QueryResponse:
      type: object
      required:
        - question
        - processing_time_ms
        - timestamp
      properties:
        question:
          type: string
          description: The original question asked
        answer:
          type: string
          nullable: true
          description: |
            The generated answer based on knowledge graph and vector search.
            May be null if no relevant information found.
        graph_context:
          type: object
          nullable: true
          description: Context information from knowledge graph traversal
          properties:
            nodes_found:
              type: integer
              description: Number of relevant nodes found
            relationships:
              type: array
              items:
                type: string
              description: Types of relationships discovered
            components:
              type: array
              items:
                type: string
              description: Types of PLC components involved
        vector_context:
          type: array
          nullable: true
          description: Context information from vector similarity search
          items:
            type: object
            properties:
              source:
                type: string
                description: Source document or file
              relevance:
                type: number
                format: float
                description: Relevance score (0.0 to 1.0)
              snippet:
                type: string
                description: Relevant text snippet
        citations:
          type: array
          description: Sources and references for the answer
          items:
            $ref: '#/components/schemas/Citation'
        processing_time_ms:
          type: number
          format: float
          description: Time taken to process the query in milliseconds
        timestamp:
          type: string
          format: date-time
          description: When the query was processed

    Citation:
      type: object
      required:
        - source
        - relevance
        - snippet
      properties:
        source:
          type: string
          description: Source document, file, or component name
          example: "MainProgram_v1.2.L5X"
        relevance:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Relevance score for this citation
          example: 0.89
        snippet:
          type: string
          description: Relevant text or description from the source
          example: "TemperatureControl_v2.1 AOI configured for PID control"

    SystemStats:
      type: object
      properties:
        total_documents:
          type: integer
          description: Total number of documents in the system
        total_nodes:
          type: integer
          description: Total number of nodes in the knowledge graph
        total_embeddings:
          type: integer
          description: Total number of vector embeddings
        last_update:
          type: string
          format: date-time
          description: When the system was last updated

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error type or code
          example: "INVALID_TOKEN"
        message:
          type: string
          description: Human-readable error message
          example: "Invalid authentication token provided"
        details:
          type: object
          description: Additional error details (optional)
        timestamp:
          type: string
          format: date-time
          description: When the error occurred

tags:
  - name: Query
    description: Knowledge graph and vector search operations
  - name: System
    description: System health and statistics 