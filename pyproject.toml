[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plc-format-converter"
version = "2.1.2"
description = "Industry-leading PLC format converter with 95%+ data preservation and git-native development workflows"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "PLC GPT Team", email = "support@plcgpt.com"}
]
maintainers = [
    {name = "PLC GPT Team", email = "support@plcgpt.com"}
]
keywords = [
    "plc", "automation", "rockwell", "studio5000", "acd", "l5x", 
    "conversion", "industrial", "controllogix", "ladder-logic", "git-optimization",
    "data-preservation", "phase39", "enhanced"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Version Control :: Git",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.0.0",
    "structlog>=22.0.0",
    "pydantic>=2.0.0",
    "lxml>=4.6.0",
    "xmlschema>=2.0.0",
    "pathlib-abc>=0.1.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
]
studio5000 = [
    "pywin32>=300; sys_platform == 'win32'",
    "comtypes>=1.1.0; sys_platform == 'win32'",
]
enhanced = [
    "acd-tools>=0.1.0",
    "l5x>=0.1.0",
    "pylogix>=0.8.0",
    "pycomm3>=1.2.0",
]
all = [
    "plc-format-converter[dev,studio5000,enhanced]"
]

[project.urls]
Homepage = "https://github.com/reh3376/acd-l5x-tool-lib"
Documentation = "https://github.com/reh3376/acd-l5x-tool-lib/blob/main/docs/"
Repository = "https://github.com/reh3376/acd-l5x-tool-lib.git"
"Bug Tracker" = "https://github.com/reh3376/acd-l5x-tool-lib/issues"
Changelog = "https://github.com/reh3376/acd-l5x-tool-lib/blob/main/CHANGELOG.md"
"PyPI" = "https://pypi.org/project/plc-format-converter/"
"Release Notes" = "https://github.com/reh3376/acd-l5x-tool-lib/releases/tag/v2.1.2"

[project.scripts]
acd2l5x = "plc_format_converter.cli:acd2l5x"
l5x2acd = "plc_format_converter.cli:l5x2acd"
plc-convert = "plc_format_converter.cli:main"
plc-validate = "plc_format_converter.cli:validate"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["plc_format_converter*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
plc_format_converter = [
    "schemas/*.json",
    "templates/*.xml",
    "data/*.yaml",
]

# Development tools configuration
[tool.black]
line-length = 100
target-version = ['py314']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | n8n-framework
  # markdown files
  | .*\.md$
  | .*\.mdx$
)/
'''

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [
    "*.md",
    "*.mdx",
    "**/*.md",
    "**/*.mdx",
    "n8n-framework/",
    "n8n-framework/**/*",
    "**/n8n-framework/**/*",
]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
no_implicit_reexport = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = [
    "n8n-framework/",
    "n8n-framework/.*",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=plc_format_converter",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "studio5000: marks tests requiring Studio 5000",
    "windows: marks tests requiring Windows platform",
    "phase39: marks tests for Phase 3.9 enhanced features",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Package metadata for build
[tool.hatch.metadata.hooks.requirements]
files = []

# Entry points for CLI commands
[project.entry-points."console_scripts"]
acd2l5x = "plc_format_converter.cli:acd2l5x"
l5x2acd = "plc_format_converter.cli:l5x2acd"
plc-convert = "plc_format_converter.cli:main"
plc-validate = "plc_format_converter.cli:validate"
plc-capabilities = "plc_format_converter.cli:capabilities"

# Plugin entry points for extensibility
[project.entry-points."plc_format_converter.handlers"]
acd = "plc_format_converter.formats.acd_handler:ACDHandler"
l5x = "plc_format_converter.formats.l5x_handler:L5XHandler"

[project.entry-points."plc_format_converter.validators"]
default = "plc_format_converter.utils.validation:PLCValidator"

# Build configuration
[tool.setuptools_scm]
write_to = "src/plc_format_converter/_version.py"
version_scheme = "python-simplified-semver"
local_scheme = "dirty-tag" 