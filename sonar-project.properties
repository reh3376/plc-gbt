# SonarQube Configuration for PLC-GBT Project
# Excludes markdown files from analysis

# Project identification
sonar.projectKey=plc-gbt
sonar.projectName=PLC-GBT
sonar.projectVersion=1.0

# Source code configuration
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions - Remove markdown files from all analysis
sonar.exclusions=**/*.md,**/*.mdx,**/*.MD,**/*.MDX

# Language-specific exclusions
sonar.python.exclusions=**/*.md,**/*.mdx
sonar.javascript.exclusions=**/*.md,**/*.mdx
sonar.typescript.exclusions=**/*.md,**/*.mdx

# Test exclusions (if needed)
sonar.test.exclusions=**/*test*/**,**/tests/**,**/*.test.*

# Coverage exclusions
sonar.coverage.exclusions=**/*.md,**/*.mdx,**/tests/**,**/*test*/**

# Ignore files in specific directories
sonar.exclusions=**/.git/**,**/.vscode/**,**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/__pycache__/**,**/*.md,**/*.mdx 