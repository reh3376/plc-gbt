name: Phase 16 Comprehensive Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      coverage_threshold:
        description: 'Coverage threshold percentage'
        required: false
        default: '95'
        type: string

env:
  COVERAGE_THRESHOLD: ${{ github.event.inputs.coverage_threshold || '95' }}
  PYTHON_VERSION: '3.14'

jobs:
  phase16-comprehensive-testing:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        test-category: [unit, integration, security, performance, e2e, production]

    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/password
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
          - 7474:7474
        options: --health-cmd="cypher-shell -u neo4j -p password 'RETURN 1'" --health-interval=10s --health-timeout=5s --health-retries=5

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: postgres
          POSTGRES_DB: plc_gpt
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache uv dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev

      - name: Install Python dependencies with uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install -e .[dev]
          uv pip install pytest pytest-cov coverage pytest-xdist pytest-timeout pytest-html pytest-json-report pytest-benchmark bandit safety semgrep locust

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to be ready..."
          sleep 30

          # Test Neo4j connection
          curl -f http://localhost:7474/db/data/ || echo "Neo4j not ready"

          # Test Qdrant connection
          curl -f http://localhost:6333/health || echo "Qdrant not ready"

          # Test PostgreSQL connection
          pg_isready -h localhost -p 5432 -U postgres || echo "PostgreSQL not ready"

          # Test Redis connection
          redis-cli -h localhost -p 6379 ping || echo "Redis not ready"

      - name: Set up environment variables
        run: |
          echo "NEO4J_URI=bolt://localhost:7687" >> $GITHUB_ENV
          echo "NEO4J_USER=neo4j" >> $GITHUB_ENV
          echo "NEO4J_PASSWORD=password" >> $GITHUB_ENV
          echo "QDRANT_HOST=localhost" >> $GITHUB_ENV
          echo "QDRANT_PORT=6333" >> $GITHUB_ENV
          echo "POSTGRES_HOST=localhost" >> $GITHUB_ENV
          echo "POSTGRES_PORT=5432" >> $GITHUB_ENV
          echo "POSTGRES_USER=postgres" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=password" >> $GITHUB_ENV
          echo "POSTGRES_DB=plc_gbt" >> $GITHUB_ENV
          echo "REDIS_HOST=localhost" >> $GITHUB_ENV
          echo "REDIS_PORT=6379" >> $GITHUB_ENV

      - name: Run Phase 16 Comprehensive Testing
        run: |
          # Navigate to plc-gbt-stack directory
          cd plc-gbt-stack || { echo "❌ Cannot find plc-gbt-stack directory"; pwd; ls -la; exit 1; }
          echo "🚀 Running Phase 16 Comprehensive Testing"
          echo "Coverage Threshold: ${{ env.COVERAGE_THRESHOLD }}%"
          echo "Test Category: ${{ matrix.test-category }}"

          # Run comprehensive testing framework
          python -m pytest tests/phase16_comprehensive_test_suite.py \
            -v \
            --cov=. \
            --cov-report=html:htmlcov \
            --cov-report=json:coverage.json \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} \
            --junitxml=test-results.xml \
            --html=test-report.html \
            --self-contained-html \
            -m "${{ matrix.test-category }}" \
            --timeout=300

      - name: Security Testing
        if: matrix.test-category == 'security'
        run: |
          cd plc-gbt-stack || { echo "❌ Cannot find plc-gbt-stack directory"; exit 1; }
          echo "🔒 Running Security Tests"

          # Bandit security linting
          bandit -r . -f json -o bandit-report.json || true

          # Safety dependency check
          safety check --json --output safety-report.json || true

          # Semgrep security analysis
          semgrep --config=auto --json --output=semgrep-report.json . || true

      - name: Performance Testing
        if: matrix.test-category == 'performance'
        run: |
          cd plc-gbt-stack || { echo "❌ Cannot find plc-gbt-stack directory"; exit 1; }
          echo "⚡ Running Performance Tests"

          # Run performance benchmarks
          python -m pytest tests/ -m performance --benchmark-only --benchmark-json=benchmark-results.json || true

      - name: Load Testing
        if: matrix.test-category == 'performance'
        run: |
          cd plc-gbt-stack || { echo "❌ Cannot find plc-gbt-stack directory"; exit 1; }
          echo "📊 Running Load Tests"

          # Create simple load test
          cat > load_test.py << 'EOF'
          from locust import HttpUser, task, between

          class PLCGPTUser(HttpUser):
              wait_time = between(1, 3)
              
              @task
              def health_check(self):
                  self.client.get("/health")
          EOF

          # Run load test (headless)
          locust -f load_test.py --headless -u 10 -r 2 -t 30s --host=http://localhost:8000 || true

      - name: Generate Coverage Report
        if: always()
        run: |
          cd plc-gbt-stack || { echo "❌ Cannot find plc-gbt-stack directory"; pwd; ls -la; exit 1; }
          echo "📊 Generating Coverage Report"

          # Generate coverage report
          coverage report --show-missing || echo "⚠️ Coverage report not available"
          coverage html || echo "⚠️ HTML coverage report not available"

          # Check coverage threshold
          if command -v coverage >/dev/null 2>&1; then
            COVERAGE=$(coverage report --format=total 2>/dev/null || echo "0")
            echo "Coverage: ${COVERAGE}%"

            if (( $(echo "$COVERAGE < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
              echo "❌ Coverage ${COVERAGE}% is below threshold ${{ env.COVERAGE_THRESHOLD }}%"
              echo "⚠️ Continuing with warning..."
            else
              echo "✅ Coverage ${COVERAGE}% meets threshold ${{ env.COVERAGE_THRESHOLD }}%"
            fi
          else
            echo "⚠️ Coverage tool not available, skipping coverage check"
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.test-category }}
          path: |
            plc-gbt-stack/test-results.xml
            plc-gbt-stack/test-report.html
            plc-gbt-stack/coverage.json
            plc-gbt-stack/coverage.xml
            plc-gbt-stack/htmlcov/
            plc-gbt-stack/bandit-report.json
            plc-gbt-stack/safety-report.json
            plc-gbt-stack/semgrep-report.json
            plc-gbt-stack/benchmark-results.json
            plc-gbt-stack/results/phase16/

      - name: Upload Coverage to Codecov
        if: matrix.test-category == 'unit'
        uses: codecov/codecov-action@v4
        with:
          file: plc-gbt-stack/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

      - name: Comment Coverage on PR
        if: github.event_name == 'pull_request' && matrix.test-category == 'unit'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = './plc-gbt-stack/coverage.json';

            if (fs.existsSync(path)) {
              const coverage = JSON.parse(fs.readFileSync(path, 'utf8'));
              const totalCoverage = coverage.totals.percent_covered;
              
              const threshold = ${{ env.COVERAGE_THRESHOLD }};
              const currentCategory = '${{ matrix.test-category }}';
              const status = totalCoverage >= threshold ? '✅ PASS' : '❌ FAIL';
              
              const categoryStatus = (category) => {
                return currentCategory === category ? '✅ Completed' : '⏳ Pending';
              };
              
              const comment = `## 📊 Phase 16 Test Coverage Report
              
              **Overall Coverage**: ${totalCoverage.toFixed(2)}%
              **Threshold**: ${threshold}%
              **Status**: ${status}
              
              ### Coverage by Category
              - **Unit Tests**: ${categoryStatus('unit')}
              - **Integration Tests**: ${categoryStatus('integration')}
              - **Security Tests**: ${categoryStatus('security')}
              - **Performance Tests**: ${categoryStatus('performance')}
              - **E2E Tests**: ${categoryStatus('e2e')}
              - **Production Tests**: ${categoryStatus('production')}
              
              [View Full Coverage Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  phase16-summary:
    needs: phase16-comprehensive-testing
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate Phase 16 Summary Report
        run: |
          echo "# 🚀 Phase 16 Comprehensive Testing Summary" > phase16-summary.md
          echo "**Date**: $(date)" >> phase16-summary.md
          echo "**Coverage Threshold**: ${{ env.COVERAGE_THRESHOLD }}%" >> phase16-summary.md
          echo "" >> phase16-summary.md

          echo "## Test Categories Results" >> phase16-summary.md
          for category in unit integration security performance e2e production; do
            if [ -d "test-results-$category" ]; then
              echo "- ✅ $category: Completed" >> phase16-summary.md
            else
              echo "- ❌ $category: Failed" >> phase16-summary.md
            fi
          done

          echo "" >> phase16-summary.md
          echo "## Artifacts Generated" >> phase16-summary.md
          echo "- Test Results (XML/HTML)" >> phase16-summary.md
          echo "- Coverage Reports (HTML/JSON/XML)" >> phase16-summary.md
          echo "- Security Scan Results" >> phase16-summary.md
          echo "- Performance Benchmarks" >> phase16-summary.md
          echo "- Phase 16 Implementation Results" >> phase16-summary.md

          cat phase16-summary.md

      - name: Upload Summary Report
        uses: actions/upload-artifact@v4
        with:
          name: phase16-summary-report
          path: phase16-summary.md
