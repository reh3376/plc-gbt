name: PLC Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-plc-files:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Sync project dependencies (Python 3.12)
        run: |
          uv sync --python 3.12

      - name: Validate L5X files
        run: |
          echo "🔍 Validating L5X files..."
          find . -name "*.L5X" -type f | while read file; do
            echo "Validating: $file"
            python -c "
          import xml.etree.ElementTree as ET
          import sys
          try:
              tree = ET.parse('$file')
              root = tree.getroot()
              programs = len(root.findall('.//Program'))
              routines = len(root.findall('.//Routine'))
              print('✅ Valid L5X: {} programs, {} routines'.format(programs, routines))
          except Exception as e:
              print('❌ Invalid L5X: {}'.format(e))
              sys.exit(1)
          "
          done

      - name: Check file sizes
        run: |
          echo "📊 Checking file sizes..."
          find . -name "*.L5X" -o -name "*.ACD" | while read file; do
            size=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null || echo "0")
            if [ "$size" -lt 1024 ]; then
              echo "⚠️ Small file detected: $file ($size bytes)"
            else
              echo "✅ Normal file: $file ($size bytes)"
            fi
          done

      - name: Run ruff lint on backend files
        run: |
          uv pip install --system ruff
          source .venv/bin/activate
          ruff check plc-gbt-stack/api/cli_api_bridge.py plc-gbt-stack/api/plc_conversion.py plc-gbt-stack/tests/test_cli_api_bridge_smoke.py

      - name: Run backend smoke tests
        run: |
          source .venv/bin/activate
          python -m pytest plc-gbt-stack/tests/test_cli_api_bridge_smoke.py -v --tb=short
